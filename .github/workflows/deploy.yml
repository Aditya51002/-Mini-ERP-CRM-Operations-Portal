name: CI/CD Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Required GitHub repository secrets:
# DOCKERHUB_USERNAME: Docker Hub username/namespace that owns the image repos.
# DOCKERHUB_TOKEN: Docker Hub access token with permission to push/pull images.
# EC2_HOST: Elastic IP address or public DNS name of the EC2 instance.
# EC2_USER: Optional SSH username for the instance (defaults to "ubuntu").
# EC2_SSH_KEY: Private SSH key that can connect to the EC2 instance.
#
# The EC2 host must already contain a deploy directory with docker-compose.yml
# and .env. This workflow only pulls new images and restarts containers.

env:
  NODE_VERSION: "20"
  DEPLOY_DIR: /opt/mini-erp-crm

jobs:
  build-and-push:
    name: Build, Test, and Push Images
    runs-on: ubuntu-latest
    env:
      BACKEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mini-erp-crm-backend
      FRONTEND_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mini-erp-crm-frontend
      REPORTS_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/mini-erp-crm-reports
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Hub secrets
        id: dockerhub-secrets
        shell: bash
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "has_credentials=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Docker Hub secrets are not configured. Image push will be skipped."
            echo "has_credentials=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: backend
        run: npm run prisma:generate

      - name: Type-check backend
        working-directory: backend
        run: npm run typecheck

      - name: Run backend lint
        working-directory: backend
        run: npm run lint

      - name: Run backend tests
        working-directory: backend
        run: npm test

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend lint
        working-directory: frontend
        run: npm run lint

      - name: Lint reporting service
        run: |
          python -m pip install ruff
          ruff check backend-python
          ruff format --check backend-python

      - name: Build reporting service image
        run: docker build -t mini-erp-crm-reports:ci ./backend-python

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: steps.dockerhub-secrets.outputs.has_credentials == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        if: steps.dockerhub-secrets.outputs.has_credentials == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}

      - name: Build and push frontend image
        if: steps.dockerhub-secrets.outputs.has_credentials == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            VITE_API_URL=/api
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}

      - name: Build and push reporting image
        if: steps.dockerhub-secrets.outputs.has_credentials == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ./backend-python
          push: true
          tags: |
            ${{ env.REPORTS_IMAGE }}:latest
            ${{ env.REPORTS_IMAGE }}:${{ github.sha }}

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate EC2 secrets
        id: ec2-secrets
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$EC2_HOST" ] && [ -n "$EC2_SSH_KEY" ] && [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "can_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Deploy secrets are not fully configured. Deployment will be skipped."
            echo "can_deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure SSH
        if: steps.ec2-secrets.outputs.can_deploy == 'true'
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e
          EC2_HOST_VALUE="$EC2_HOST"
          EC2_USER_VALUE="${EC2_USER:-ubuntu}"
          if [[ "$EC2_HOST_VALUE" == *"@"* ]]; then
            if [ -z "${EC2_USER:-}" ]; then
              EC2_USER_VALUE="${EC2_HOST_VALUE%@*}"
            fi
            EC2_HOST_VALUE="${EC2_HOST_VALUE#*@}"
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST_VALUE" >> ~/.ssh/known_hosts

      - name: Pull images and restart compose stack
        if: steps.ec2-secrets.outputs.can_deploy == 'true'
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -e
          EC2_HOST_VALUE="$EC2_HOST"
          EC2_USER_VALUE="${EC2_USER:-ubuntu}"
          if [[ "$EC2_HOST_VALUE" == *"@"* ]]; then
            if [ -z "${EC2_USER:-}" ]; then
              EC2_USER_VALUE="${EC2_HOST_VALUE%@*}"
            fi
            EC2_HOST_VALUE="${EC2_HOST_VALUE#*@}"
          fi
          SSH_TARGET="${EC2_USER_VALUE}@${EC2_HOST_VALUE}"

          printf '%s' "$DOCKERHUB_TOKEN" |
            ssh -i ~/.ssh/ec2_key "$SSH_TARGET" \
              "docker login -u '$DOCKERHUB_USERNAME' --password-stdin"

          scp -i ~/.ssh/ec2_key docker-compose.production.yml \
            "$SSH_TARGET:${DEPLOY_DIR}/docker-compose.production.yml"

          ssh -i ~/.ssh/ec2_key "$SSH_TARGET" \
            "set -e; \
             cd '${DEPLOY_DIR}'; \
             export IMAGE_TAG='${IMAGE_TAG}'; \
             export DOCKERHUB_USERNAME='${DOCKERHUB_USERNAME}'; \
             docker compose -f docker-compose.production.yml pull; \
             docker compose -f docker-compose.production.yml up -d; \
             docker image prune -f"
